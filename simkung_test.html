<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>심쿵 한마디</title>
<meta property="og:title" content="심쿵 한마디">
<meta property="og:description" content="오늘 마음이 가는 쪽은? — 매달 한 편씩 전합니다">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#16233F; --ink-soft:#2C3E5E; --paper:#EFF2F6; --surface:#FFFFFF;
  --coral:#E2574C; --amber:#C9922E; --muted:#6B7A90; --line:#D9E0E9; --maxw:400px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 14px}

.card{max-width:var(--maxw);width:100%;background:var(--surface);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 50px rgba(22,35,63,.16)}

/* 머리 */
.top{background:var(--ink);color:#fff;padding:34px 28px 28px;text-align:center;position:relative;overflow:hidden}
.top::after{content:'';position:absolute;right:-60px;top:-70px;width:190px;height:190px;
  border:1px solid rgba(255,255,255,.09);border-radius:50%}
.top::before{content:'';position:absolute;left:-46px;bottom:-56px;width:150px;height:150px;
  border:1px solid rgba(201,146,46,.22);border-radius:50%}
.top>*{position:relative;z-index:2}
.month{font-size:11.5px;letter-spacing:.2em;color:var(--amber);font-weight:600;margin-bottom:11px}
.ttl{font-family:'Gowun Batang',serif;font-size:25px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:9px}

/* 고르는 자리 */
#askWrap{background:var(--paper);padding-bottom:2px}
.ask{padding:26px 24px 0;text-align:center;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.hint{padding:9px 24px 0;text-align:center;font-size:12.5px;
  color:var(--amber);letter-spacing:-.01em}
.picks{padding:16px 20px 26px;display:flex;flex-direction:column;gap:12px}
.pick{position:relative;width:100%;background:var(--surface);border:1.5px solid #D5DEE9;border-radius:15px;
  padding:24px 22px 24px 56px;font-family:'Gowun Batang',serif;font-size:17px;font-weight:400;line-height:1.85;
  color:var(--ink);text-align:left;cursor:pointer;letter-spacing:-.02em;overflow:hidden;
  box-shadow:0 4px 14px rgba(22,35,63,.08);transition:border-color .18s,background .18s,box-shadow .18s}
.pick::after{content:'\201D';position:absolute;right:12px;bottom:-30px;font-family:'Gowun Batang',serif;
  font-size:88px;line-height:1;color:rgba(22,35,63,.042);pointer-events:none}
.pick .txt{position:relative;z-index:2;display:block}
.pick .mark{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:2px solid #9FB0C6;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:system-ui,sans-serif;font-size:14px;font-weight:700;color:transparent;
  background:var(--surface);transition:background .18s,border-color .18s,color .18s}
.pick:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.pick:active{border-color:var(--amber)}
@media(hover:hover){.pick:hover{border-color:var(--amber);box-shadow:0 6px 18px rgba(22,35,63,.12)}
  .pick:hover .mark{border-color:var(--amber)}}
.pick.sel{border-color:var(--coral);background:#FFF7F6;box-shadow:0 6px 18px rgba(226,87,76,.18)}
.pick.sel .mark{background:var(--coral);border-color:var(--coral);color:#fff}

/* 고른 뒤 */
.chosen{display:none;padding:30px 24px 26px}
.chosen.on{display:block}
.chosenbox{background:var(--ink);color:#fff;border-radius:14px;padding:30px 24px}
.chosenbox .q{font-family:'Gowun Batang',serif;font-size:19.5px;line-height:1.8;letter-spacing:-.02em}
.chosenbox .by{margin-top:12px;font-size:13px;color:var(--amber);letter-spacing:-.01em}
.chosenbox .r{margin-top:16px;padding-top:17px;border-top:1px solid rgba(255,255,255,.14);
  font-size:14px;line-height:1.85;color:rgba(255,255,255,.76)}
.again{display:block;width:100%;margin-top:14px;background:none;border:none;font-family:inherit;
  font-size:12.5px;color:var(--muted);cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:3px}

/* 메모 */
.memo{margin:22px 24px 0;padding:20px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;border-left:3px solid var(--amber)}
.memo .mt{font-size:12px;font-weight:700;color:var(--amber);margin-bottom:9px;letter-spacing:-.01em}
.memo .mb{font-size:13.5px;line-height:1.8;color:var(--ink-soft)}

/* 나누기 */
.sharebar{padding:22px 24px 6px}
.sharebtn{display:block;width:100%;padding:16px;background:var(--coral);color:#fff;border:none;border-radius:10px;
  font-family:inherit;font-size:15.5px;font-weight:700;letter-spacing:-.02em;cursor:pointer}
.sharebtn:active{background:#C8483E}
@media(hover:hover){.sharebtn:hover{background:#C8483E}}
.shareNote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.55}

/* FC */
.fc{margin:20px 24px 0;padding:17px 18px;border:1px solid var(--line);border-radius:12px}
.fc .who{font-size:13.5px;font-weight:700}
.fc .org{font-size:11.5px;color:var(--muted);margin-top:3px}
.fcacts{display:flex;gap:8px;margin-top:14px}
.fcacts a{flex:1;text-align:center;padding:11px 4px;border:1px solid var(--line);border-radius:9px;
  text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600}
.fcacts a:active{background:var(--paper)}
@media(hover:hover){.fcacts a:hover{background:var(--paper)}}

footer{padding:22px 24px 26px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="card">

  <div class="top">
    <div class="month" id="mLabel">9월</div>
    <div class="ttl">심쿵 한마디</div>
    <div class="sub" id="sub">매달 한 편씩 전합니다</div>
  </div>

  <div id="askWrap">
    <div class="ask">오늘 마음이 가는 쪽은?</div>
    <div class="hint">두 문장 중 하나를 눌러보세요</div>
    <div class="picks">
      <button class="pick" id="pickA" onclick="choose('a',this)">
        <span class="mark" aria-hidden="true">&#10003;</span>
        <span class="txt" id="txtA"></span>
      </button>
      <button class="pick" id="pickB" onclick="choose('b',this)">
        <span class="mark" aria-hidden="true">&#10003;</span>
        <span class="txt" id="txtB"></span>
      </button>
    </div>
  </div>

  <div class="chosen" id="chosen">
    <div class="chosenbox">
      <div class="q" id="cq"></div>
      <div class="by" id="cby"></div>
      <div class="r" id="cr"></div>
    </div>
    <button class="again" onclick="reset()">다른 한마디도 보기</button>
  </div>

  <div class="memo">
    <div class="mt" id="memoTitle">이달의 메모</div>
    <div class="mb" id="memoBody"></div>
  </div>

  <div class="sharebar">
    <button class="sharebtn" onclick="shareIt()">심쿵 한마디 전하기</button>
    <div class="shareNote">링크만 전해집니다.<br>하실 말씀은 링크보다 먼저 따로 보내세요.</div>
  </div>

  <div class="fc" id="fcBox">
    <div class="who" id="fcWho"></div>
    <div class="org" id="fcOrg"></div>
    <div class="fcacts" id="fcActs"></div>
  </div>

  <footer id="foot"></footer>

</div>

<script>
/* ─────────────────────────────────────────
   1) 열두 달 콘텐츠
      한 달에 8문장 = 4세트(A군 1문장 + B군 1문장)
      1주=1세트, 2주=2세트, 3주=3세트, 4주와 5주=4세트
   ───────────────────────────────────────── */
const MONTHS = {
  1:{ memo:"새해 첫 달에 자동이체 목록을 한 번 훑어보십시오. 몇 해째 빠져나가는데 뭔지도 모르는 항목이 꼭 하나둘 있습니다.",
    sets:[
    {a:{q:"가장 큰 위험은 위험을 전혀 감수하지 않는 것이다.",by:"스티븐 코비",r:"아무것도 하지 않는 것도 하나의 선택이고, 그 선택에도 대가가 따릅니다."},
     b:{q:"가족은 중요한 것이 아니다. 가족은 모든 것이다.",by:"마이클 J. 폭스",r:"한 해의 계획을 세울 때 맨 앞에 무엇을 둘지 정하는 일입니다."}},
    {a:{q:"오늘 할 수 있는 일에 전념하라. 그러면 내일은 더 나아져 있을 것이다.",by:"아이작 뉴턴",r:"내일을 걱정하는 시간보다 오늘 한 가지를 끝내는 편이 빠릅니다."},
     b:{q:"새해의 가장 좋은 계획은 더 나은 사람이 되는 것이다.",by:"작자 미상",r:"목표를 숫자로만 적으면 다 못 지킵니다. 사람됨은 매일 지킬 수 있습니다."}},
    {a:{q:"삶을 바꾸고 싶다면, 오늘 당장 당신의 일상 속에서 무언가를 바꾸어라.",by:"존 C. 맥스웰",r:"거창할 필요 없습니다. 아침에 물 한 잔, 저녁에 십 분 걷기부터."},
     b:{q:"인생의 사명은 단 한 번뿐이다. 살아 있는 한 그 사명은 끝나지 않는다.",by:"리처드 바크",r:"늦었다고 여기는 나이에도 할 일은 남아 있습니다."}},
    {a:{q:"부(富)는 우리가 쓰지 않는 돈에서 온다.",by:"조지 첼리스",r:"더 버는 것보다 새는 곳을 막는 편이 확실합니다."},
     b:{q:"오늘은 남은 인생의 첫날이다.",by:"작자 미상",r:"1월 1일을 놓쳤어도 괜찮습니다. 오늘이 그 첫날입니다."}}
  ]},
  2:{ memo:"주소나 연락처가 바뀌면 금융기관마다 따로 알려야 합니다. 한 곳에 알렸다고 다 바뀌지 않아서, 정작 중요한 우편물이 옛 주소로 갑니다.",
    sets:[
    {a:{q:"성찰하지 않는 삶은 살 가치가 없다.",by:"소크라테스",r:"바쁘게 사는 것과 잘 사는 것은 다른 이야기입니다."},
     b:{q:"가족은 우리의 과거와 연결되고 미래로 이어지는 다리다.",by:"알렉스 헤일리",r:"내가 지금 하는 선택은 다리 위를 지나 다음 사람에게 갑니다."}},
    {a:{q:"타인을 아는 자는 지혜롭고, 스스로를 아는 자는 명철하다.",by:"노자",r:"남을 살피는 눈의 절반만 나에게 돌려도 충분합니다."},
     b:{q:"다른 사람에게서 우리를 화나게 하는 모든 것은 우리 자신을 이해하는 데 도움이 된다.",by:"칼 융",r:"유독 거슬리는 사람이 있다면, 거기에 내 이야기가 섞여 있습니다."}},
    {a:{q:"진정한 발견은 새로운 풍경을 찾는 것이 아니라, 새로운 눈을 가지는 데 있다.",by:"마르셀 프루스트",r:"자리를 옮기지 않아도 달라지는 것이 있습니다."},
     b:{q:"아는 것만으로는 충분하지 않다. 적용해야 한다. 의지만으로도 충분하지 않다. 행동해야 한다.",by:"괴테",r:"알고 있다는 느낌이 가장 오래 사람을 붙잡아둡니다."}},
    {a:{q:"가족의 사랑은 세상의 어떤 찬바람도 막아주는 가장 따뜻한 외투이다.",by:"작자 미상",r:"바깥이 추울수록 집 안의 온도가 중요해집니다."},
     b:{q:"세상을 바꾸고 싶다면 먼저 자신을 바꾸어라.",by:"간디의 말로 전해짐",r:"가장 손대기 쉬운 사람이 바로 나입니다."}}
  ]},
  3:{ memo:"신분증과 중요한 서류는 사진으로 찍어 휴대폰에 넣어두십시오. 잃어버렸을 때 원본보다 사진 한 장이 더 빨리 일을 해결해줍니다.",
    sets:[
    {a:{q:"인내는 쓰지만 그 열매는 달다.",by:"장 자크 루소",r:"지금 견디는 일이 뭘 위한 것인지만 잊지 않으면 됩니다."},
     b:{q:"안전한 항구에만 머문다면 배는 결코 새로운 바다를 발견하지 못한다.",by:"존 A. 셰드",r:"항구는 배를 지켜주지만, 배가 있어야 할 곳은 아닙니다."}},
    {a:{q:"행동은 모든 성공의 가장 기초적인 열쇠이다.",by:"파블로 피카소",r:"준비가 덜 됐다는 느낌은 시작한 뒤에야 사라집니다."},
     b:{q:"변화는 모든 진정한 배움의 결과다.",by:"레오 버스카글리아",r:"배운 뒤에 달라진 게 없다면, 아직 배운 것이 아닙니다."}},
    {a:{q:"목표를 향해 나아가는 과정 자체가 보상이다.",by:"스티브 잡스",r:"도착해야만 좋은 것이라면 대부분의 날이 헛됩니다."},
     b:{q:"작은 습관의 변화가 1년 뒤 전혀 다른 인생을 만들어낸다.",by:"제임스 클리어",r:"하루치는 티가 안 납니다. 1년치는 숨길 수가 없습니다."}},
    {a:{q:"작은 기회로부터 종종 위대한 업적이 시작된다.",by:"데모스테네스",r:"큰 기회는 알아보기 쉽지만, 대개 작은 얼굴로 옵니다."},
     b:{q:"가장 큰 위험은 너무 높은 목표를 세우고 실패하는 것이 아니라, 너무 낮은 목표를 세우고 그것을 이루는 것이다.",by:"미켈란젤로의 말로 전해짐",r:"쉽게 이룬 목표는 성취감도 그만큼 짧습니다."}}
  ]},
  4:{ memo:"건강검진 미루지 마십시오. 미루는 이유는 늘 바빠서인데, 그 바쁜 일은 내년에도 그대로 있습니다.",
    sets:[
    {a:{q:"어제와 똑같이 살면서 다른 미래를 기대하는 것은 어리석은 일이다.",by:"알베르트 아인슈타인",r:"바뀌길 바라는 마음과 바꾸는 행동은 다른 일입니다."},
     b:{q:"우리는 사물을 있는 그대로 보는 것이 아니라, 우리 자신의 방식대로 본다.",by:"아나이스 닌",r:"같은 상황을 두고 사람마다 다른 말을 하는 이유입니다."}},
    {a:{q:"우리가 어쩔 수 없는 일에 마음을 쓰기보다, 통제할 수 있는 일에 집중할 때 깨달음이 온다.",by:"에픽테토스",r:"걱정의 대부분은 내 손이 닿지 않는 곳에 있습니다."},
     b:{q:"편안함이 끝나는 자리에서 성장이 시작된다.",by:"토니 로빈스",r:"불편한 느낌은 잘못됐다는 신호가 아니라 자라는 중이라는 신호입니다."}},
    {a:{q:"씨앗이 땅에 묻혀 어둠을 견뎌야 비로소 아름다운 꽃이 피어난다.",by:"헬렌 켈러",r:"보이지 않는 기간이 있어야 보이는 결과가 생깁니다."},
     b:{q:"당신이 아무것도 바꾸지 않는다면 아무것도 변하지 않는다.",by:"작자 미상",r:"기다림도 오래되면 그냥 미루기가 됩니다."}},
    {a:{q:"스스로에게 솔직해질 때 비로소 타인의 아픔과 세상의 진실이 보이기 시작한다.",by:"톨스토이",r:"나를 속이는 동안에는 남의 사정도 잘 보이지 않습니다."},
     b:{q:"조용해질수록 더 많은 것을 들을 수 있다.",by:"람 다스",r:"말을 줄이면 상대가 진짜 하려던 말이 들립니다."}}
  ]},
  5:{ memo:"우리의 경쟁자는 AI가 아니라, AI를 나보다 잘 쓰는 사람입니다. 어렵게 배울 것도 없습니다. 궁금한 걸 말로 물어보는 것부터가 시작입니다.",
    sets:[
    {a:{q:"세상에서 가장 아름다운 것은 우리를 둘러싼 가족의 사랑이다.",by:"작자 미상",r:"가까이 있어서 잘 안 보이는 것들이 있습니다."},
     b:{q:"가정에서 사랑은 마찰을 줄이는 기름이고, 서로를 묶는 시멘트이며, 조화를 만드는 음악이다.",by:"니체의 말로 전해짐",r:"부딪히지 않는 집이 아니라, 부딪혀도 굴러가는 집입니다."}},
    {a:{q:"집이란 사랑이 메아리치는 곳, 친구가 머무는 곳, 사랑이 영원히 피어나는 곳이다.",by:"시드니 제이 해리스",r:"집의 크기보다 그 안에서 오가는 말의 온도가 중요합니다."},

  7:{ memo:"가족 구성이 바뀌면 보험금의 주인도 바뀔 수 있습니다. 결혼·출산처럼 달라진 일이 있었다면 수익자가 누구로 되어 있는지 한 번 확인해보십시오.",

  8:{ memo:"급할 때 가족이 어디를 봐야 하는지 정해두십시오. 서류가 어느 서랍에 있는지, 누구에게 연락하면 되는지. 이것만 정해둬도 큰일이 작은 일이 됩니다.",

  10:{ memo:"잊고 지낸 돈이 있을 수 있습니다. '어카운트인포'에서 안 쓰는 계좌와 잠자는 예금을, '내보험다보여'에서 본인 이름으로 든 보험을 한눈에 볼 수 있습니다.",

/* ─────────────────────────────────────────
   3) 아래는 손대지 않으셔도 됩니다
   ───────────────────────────────────────── */
const params = new URLSearchParams(location.search);

// 이번 달 정하기 (?m=2026-10 을 붙이면 그 달을 미리 볼 수 있습니다)
let month = new Date().getMonth() + 1;
const mParam = params.get('m');
if(mParam){
  const n = parseInt(mParam.split('-').pop(), 10);
  if(n >= 1 && n <= 12) month = n;
}
if(!MONTHS[month]) month = ((month - 1) % 12) + 1;   // 어떤 경우에도 빈 화면이 나오지 않도록
const M = MONTHS[month];

/* 이번 주가 이달의 몇 째 주인지 (일요일 시작)
   1주=1세트, 2주=2세트, 3주=3세트, 4주와 5주=4세트 */
function weekOfMonth(d){
  const first = new Date(d.getFullYear(), d.getMonth(), 1).getDay();  // 그 달 1일의 요일(0=일)
  return Math.floor((d.getDate() + first - 1) / 7) + 1;
}
const today = new Date();
let week = weekOfMonth(today);
const wParam = parseInt(params.get('w'), 10);        // ?w=3 을 붙이면 3주차를 미리 볼 수 있습니다
if(wParam >= 1 && wParam <= 5) week = wParam;
const setIndex = Math.min(week, 4) - 1;
const SET = M.sets[setIndex];

// FC 정하기 (?fc=이서연)
const fcKey = params.get('fc');
const FC = (fcKey && FCS[fcKey]) ? FCS[fcKey] : null;

// 화면 채우기
document.getElementById('mLabel').textContent = month + '월';
document.getElementById('txtA').textContent = SET.a.q;
document.getElementById('txtB').textContent = SET.b.q;
document.getElementById('memoBody').textContent = M.memo;
document.title = month + '월의 심쿵 한마디';

if(FC){
  const _r = FC.role;                                   // 받침 있으면 '이', 없으면 '가'
  const _last = _r.charCodeAt(_r.length - 1);
  const _josa = (_last >= 0xAC00 && _last <= 0xD7A3 && (_last - 0xAC00) % 28 !== 0) ? '이' : '가';
  document.getElementById('sub').textContent = FC.name + ' ' + _r + _josa + ' 매달 한 편씩 전합니다';
  document.getElementById('memoTitle').textContent = FC.name + ' ' + FC.role + '의 ' + month + '월 메모';
  document.getElementById('fcWho').textContent = FC.name + ' ' + FC.role;
  document.getElementById('fcOrg').textContent = FC.org;
  document.getElementById('fcActs').innerHTML =
    '<a href="tel:' + FC.tel.replace(/-/g,'') + '">전화</a>' +
    '<a href="sms:' + FC.tel.replace(/-/g,'') + '">문자</a>' +
    '<a href="' + FC.card + '">명함 보기</a>';
  document.getElementById('foot').innerHTML = FC.org + '<br>' + FC.tel + ' · ' + FC.mail;
}else{
  document.getElementById('memoTitle').textContent = '이달의 메모';
  document.getElementById('fcBox').style.display = 'none';
  document.getElementById('foot').textContent = '';
}

function choose(k, el){
  if(el) el.classList.add('sel');            // 누른 쪽에 체크가 켜지고, 잠깐 보인 뒤 넘어갑니다
  const p = SET[k];
  document.getElementById('cq').textContent = p.q;
  document.getElementById('cby').textContent = '— ' + p.by;
  document.getElementById('cr').textContent = p.r;
  setTimeout(function(){
    document.getElementById('askWrap').style.display = 'none';
    document.getElementById('chosen').classList.add('on');
    if(el) el.classList.remove('sel');
  }, 280);
}

function reset(){
  document.getElementById('chosen').classList.remove('on');
  document.getElementById('askWrap').style.display = '';
}

function shareIt(){
  // 고른 문장은 일부러 넣지 않습니다. 미리 읽어버리면 링크를 열 이유가 없어집니다.
  // 주소만 내보냅니다. 글자를 한 자라도 붙이면 안 됩니다.
  // 카카오톡은 메시지가 링크 하나뿐일 때만 주소 글자를 감추고 카드만 보여줍니다.
  // (휴대폰·PC 모두 확인 완료. 앞에 글자를 붙이면 긴 주소가 그대로 드러납니다)
  // 하실 말씀은 링크보다 먼저 따로 보내시는 방식입니다.
  const msg = location.href;

  if(navigator.share){
    navigator.share({title: month + '월의 심쿵 한마디', text: msg}).catch(function(){});
    return;
  }
  if(navigator.clipboard){
    navigator.clipboard.writeText(msg).then(function(){
      alert('링크가 복사되었습니다. 하실 말씀을 먼저 보내신 뒤, 링크는 따로 붙여넣어 보내세요.');
    }).catch(function(){ alert(msg); });
    return;
  }
  alert(msg);
}
</script>
