<style>
:root{
  --ink:#16233F; --ink-soft:#2C3E5E; --paper:#EFF2F6; --surface:#FFFFFF;
  --coral:#E2574C; --amber:#C9922E; --muted:#6B7A90; --line:#D9E0E9;
  --rule:#C3CDDA; --maxw:400px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 14px}

.card{max-width:var(--maxw);width:100%;background:var(--surface);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 50px rgba(22,35,63,.16)}

.top{background:var(--ink);color:#fff;padding:38px 28px 30px;text-align:center;position:relative;overflow:hidden}
.top::after{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;
  border:1px solid rgba(255,255,255,.09);border-radius:50%}
.top::before{content:'';position:absolute;left:-40px;bottom:-50px;width:150px;height:150px;
  border:1px solid rgba(201,146,46,.22);border-radius:50%}
.top>*{position:relative;z-index:2}
.avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(160deg,#2C3E5E,#16233F);
  border:2px solid rgba(201,146,46,.55);display:flex;align-items:center;justify-content:center;
  font-family:'Gowun Batang',serif;font-size:20px;color:rgba(255,255,255,.85);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.eyebrow{font-size:11.5px;letter-spacing:.2em;color:var(--amber);font-weight:600;margin-bottom:10px}
.name{font-size:26px;font-weight:700;letter-spacing:-.03em}
.name .role{display:block;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.68);margin-top:4px;letter-spacing:0}

.tagline{padding:20px 28px;text-align:center;font-size:14px;color:var(--ink-soft);line-height:1.7;
  border-bottom:1px solid var(--line);background:var(--paper)}
.tagline b{color:var(--ink)}

.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line)}
.act{background:var(--surface);padding:18px 8px;text-align:center;text-decoration:none;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:background .2s}
.act .ic{width:34px;height:34px;border-radius:50%;background:rgba(226,87,76,.09);color:var(--coral);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.act:nth-child(2) .ic,.act:nth-child(4) .ic{background:rgba(201,146,46,.12);color:var(--amber)}
.act strong{font-size:13.5px;font-weight:600;letter-spacing:-.02em}
.act:active{background:var(--paper)}
@media(hover:hover){.act:hover{background:var(--paper)}}

.savebar{padding:20px 24px 8px}
.savebtn{display:block;width:100%;padding:16px;background:var(--coral);color:#fff;border:none;border-radius:10px;
  font-family:inherit;font-size:15.5px;font-weight:700;letter-spacing:-.02em;cursor:pointer;text-align:center}
.savebtn:active{background:#C8483E}
@media(hover:hover){.savebtn:hover{background:#C8483E}}
.saveNote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}

.sitelink{margin:6px 24px 0;padding:15px 16px;border:1px solid var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:var(--ink);gap:10px}
.sitelink .t{font-size:13.5px;font-weight:600}
.sitelink .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.sitelink .arrow{color:var(--coral);font-size:15px;flex:0 0 auto}
.sitelink:active{background:var(--paper)}
@media(hover:hover){.sitelink:hover{background:var(--paper)}}

.quote{margin:24px 24px 0;padding:18px 20px;background:var(--ink);border-radius:10px;color:#fff}
.quote .q{font-family:'Gowun Batang',serif;font-size:14.5px;line-height:1.75}
.quote .by{margin-top:10px;font-size:11px;color:var(--amber);letter-spacing:.05em}

footer{padding:22px 24px 26px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink-soft)}
</style>
<script>
/* 카카오톡 인앱 브라우저에서 열렸을 때, 기본 브라우저로 자동 전환 */
(function(){
  try{
    var ua = navigator.userAgent || '';
    if(ua.indexOf('KAKAOTALK') === -1) return;            /* 카톡 안이 아니면 아무 일도 하지 않음 */
    if(location.search.indexOf('ext=1') !== -1) return;   /* 이미 전환된 화면이면 반복 방지 */
    var target = location.protocol + '//' + location.host + location.pathname
               + (location.search ? location.search + '&ext=1' : '?ext=1')
               + location.hash;
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target);
  }catch(e){}
})();
</script>
